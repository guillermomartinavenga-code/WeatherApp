name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Stage v0.10: lets this job request a short-lived GitHub OIDC token
      # and exchange it for GCP credentials via Workload Identity
      # Federation -- no long-lived GCP key is ever stored in GitHub.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Stage v0.9: full history, not just the last commit -- gitleaks
          # below needs every commit to reproduce the v0.1/v0.8 findings
          # documented in docs/evidencia-practica-es.md.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Stage v0.10: replaces the stage v0.4 GitHub-native encrypted secret
      # as the source of truth for OPEN_WEATHER_API_KEY. Authenticates via
      # Workload Identity Federation (vars.GCP_WORKLOAD_IDENTITY_PROVIDER /
      # vars.GCP_SERVICE_ACCOUNT_EMAIL are plain repo variables, not
      # secrets -- they're resource identifiers, not sensitive values) and
      # fetches the key from Google Secret Manager. See
      # docs/evidencia-practica-es.md for the gcloud setup (pool, provider,
      # service account, least-privilege IAM bindings).
      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - id: secrets
        name: Fetch OPEN_WEATHER_API_KEY from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            OPEN_WEATHER_API_KEY:${{ vars.GCP_PROJECT_ID }}/OPEN_WEATHER_API_KEY

      # Kept from stage v0.3 on purpose, same command, as a before/after
      # contrast: the value now comes from Secret Manager (not a GitHub
      # secret) but get-secretmanager-secrets masks it the same way, so the
      # log still shows *** instead of the real key.
      - name: Debug print build environment
        env:
          OPEN_WEATHER_API_KEY: ${{ steps.secrets.outputs.OPEN_WEATHER_API_KEY }}
        run: echo "OpenWeatherMap key in use -> $OPEN_WEATHER_API_KEY"

      # Stage v0.9: our own, reproducible scan of the full git history --
      # not a wrapper action (gitleaks-action requires a paid license for
      # non-personal org repos), just the MIT-licensed binary itself.
      - name: Run gitleaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . -v

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        env:
          OPEN_WEATHER_API_KEY: ${{ steps.secrets.outputs.OPEN_WEATHER_API_KEY }}
        run: ./gradlew :app:assembleDebug -POPEN_WEATHER_API_KEY="$OPEN_WEATHER_API_KEY"

      - name: Run unit tests
        env:
          OPEN_WEATHER_API_KEY: ${{ steps.secrets.outputs.OPEN_WEATHER_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest -POPEN_WEATHER_API_KEY="$OPEN_WEATHER_API_KEY"

  verify-fails-without-secret:
    # Stage v0.9: §11 of the reference doc calls for verifying controls, not
    # just asserting them -- this job proves app/build.gradle.kts now fails
    # the build loudly when OPEN_WEATHER_API_KEY is missing, instead of
    # silently shipping an APK with an empty key (the pre-v0.9 behavior).
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Confirm build fails loudly without the API key
        run: |
          if ./gradlew :app:assembleDebug; then
            echo "ERROR: build succeeded without OPEN_WEATHER_API_KEY set -- it should have failed."
            exit 1
          else
            echo "OK: build failed as expected when the secret is absent."
          fi
