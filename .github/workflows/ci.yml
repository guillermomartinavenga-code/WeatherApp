name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # INSECURE ON PURPOSE (stage v0.3 of the API-keys-&-secrets security
      # training exercise, see docs/evidencia-practica-es.md). The key is
      # hardcoded directly in this workflow definition file, which is tracked
      # in git and visible to anyone with read access to the repository or
      # its Actions configuration -- the same placeholder value used since
      # stage v0.1, never a real secret. The Gradle build below does not
      # currently consume this variable (the app still reads config.json from
      # the committed assets, see stage v0.2); it is wired into the build
      # starting at stage v0.4, once BuildConfig + a real GitHub Actions
      # encrypted secret replace it.
      OPEN_WEATHER_API_KEY: b7e2f1a09c3d4e5f6a7b8c9d0e1f2a3b
      # Unrelated to the security staging: the repo never commits gradle.properties
      # (see README.md), so the runner's Gradle daemon falls back to a 512 MiB max
      # heap, which isn't enough for this build and causes GC thrashing / daemon
      # kills. Override via env instead of adding gradle.properties.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # INSECURE ON PURPOSE (stage v0.3): printing a secret-shaped environment
      # variable to the build log. GitHub Actions does not know this value is
      # sensitive unless it is registered as an encrypted secret, so it is not
      # masked here -- it appears in plain text in this step's log output.
      - name: Debug print build environment
        run: echo "OpenWeatherMap key in use -> $OPEN_WEATHER_API_KEY"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
